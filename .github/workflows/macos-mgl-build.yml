name: macos-mgl-build

on: 
  workflow_dispatch:      # allows manual trigger
  

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-14 # Uses Apple Silicon runner (M1/M2)

    steps:
    - name: Checkout OpenSpace-Mac repository
      uses: actions/checkout@v4
      with:
        path: OpenSpace-Mac-Repo
    
    - name: Get official OpenSpace code
      run: |
        git clone https://github.com/OpenSpace/OpenSpace.git OpenSpace
        cd OpenSpace
        mkdir build

    - name: Merge OpenSpace-Mac into OpenSpace
      run: |
        # Copy the contents of the OpenSpace-Mac directory from our repo into the official OpenSpace repo
        cp -Rv OpenSpace-Mac-Repo/* OpenSpace/

    - name: Install and Bootstrap vcpkg
      timeout-minutes: 30
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        df -h

    - name: Configure CMake
      run: |
        cd OpenSpace/build
        
        # Configure using vcpkg toolchain to resolve dependencies
        cmake -G Xcode \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -Wno-dev \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_CXX_STANDARD=20 \
              -DONLY_ACTIVE_ARCH=YES \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
              -DCMAKE_CXX_FLAGS="-Wno-error -D_FILE_OFFSET_BITS=64" \
              -DCMAKE_C_FLAGS="-Wno-error -D_FILE_OFFSET_BITS=64" \
              -DCMAKE_BUILD_TYPE="Release"  ..

    - name: Build OpenSpace
      run: |
        cd OpenSpace/build
        cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)
